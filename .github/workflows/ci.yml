name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git libsodium-dev pkg-config libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p dist/HAU-linux-x86_64
          cp build/bin/HAU dist/HAU-linux-x86_64/
          cp README.md LICENSE dist/HAU-linux-x86_64/
          tar -czf HAU-linux-x86_64.tar.gz -C dist HAU-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: HAU-linux-x86_64
          path: HAU-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtshadertools'
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Locate pkgconf
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "(vcpkg_installed|packages)" } | Select-Object -First 1
          if (-not $pkg) { throw 'vcpkg pkgconf.exe was not found' }
          "HAU_PKGCONF=$($pkg.FullName)" >> $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DPKG_CONFIG_EXECUTABLE="$env:HAU_PKGCONF"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package runnable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/HAU-windows-x64 | Out-Null
          Copy-Item build/bin/HAU.exe dist/HAU-windows-x64/
          Copy-Item README.md,LICENSE dist/HAU-windows-x64/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --qmldir ui/qml dist/HAU-windows-x64/HAU.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/HAU-windows-x64 -DestinationPath HAU-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HAU-windows-x64
          path: HAU-windows-x64.zip
