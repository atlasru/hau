name: Parley desktop build and verification
on:
  push:
    branches: [main, 'parley/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev libavcodec-dev libavdevice-dev libavformat-dev libavutil-dev libswscale-dev libexif-dev libqrencode-dev libsqlcipher-dev libsodium-dev libopus-dev libvpx-dev libopenal-dev libv4l-dev libxss-dev libunwind-dev
      - name: Build pinned Tox core, Parley, and run tests
        env:
          ALSOFT_DRIVERS: 'null'
        run: ./scripts/build-linux.sh
      - name: Package Linux build and corresponding source
        run: |
          mkdir -p dist/Parley-linux-x86_64
          cp build/Parley LICENSE README.md dist/Parley-linux-x86_64/
          cp -r docs dist/Parley-linux-x86_64/
          ldd build/Parley > dist/Parley-linux-x86_64/runtime-dependencies.txt
          tar -czf Parley-linux-x86_64.tar.gz -C dist Parley-linux-x86_64
          git archive --format=tar.gz --prefix=Parley-source/ -o Parley-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Parley-linux-x86_64
          path: |
            Parley-linux-x86_64.tar.gz
            Parley-source.tar.gz
            build/Testing/Temporary/LastTest.log
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libexif
            mingw-w64-ucrt-x86_64-qrencode
            mingw-w64-ucrt-x86_64-sqlcipher
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-openal
      - name: Build pinned Tox core, Parley, and run tests
        shell: msys2 {0}
        env:
          ALSOFT_DRIVERS: 'null'
        run: ./scripts/build-linux.sh
      - name: Package Windows executable and runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/Parley-windows-x64
          cp build/Parley.exe LICENSE README.md dist/Parley-windows-x64/
          cp -r docs dist/Parley-windows-x64/
          windeployqt --release --compiler-runtime dist/Parley-windows-x64/Parley.exe
          ldd build/Parley.exe | awk '/\/ucrt64\/bin\// { print $3 }' | while read -r dll; do
            cp "$dll" dist/Parley-windows-x64/
          done
          git archive --format=tar.gz --prefix=Parley-source/ -o Parley-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Parley-windows-x64
          path: |
            dist/Parley-windows-x64
            Parley-source.tar.gz
            build/Testing/Temporary/LastTest.log
